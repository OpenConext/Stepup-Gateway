# Functional test service overrides and parameter overrides
# Loaded AFTER config/services.yaml (which imports parameters.yaml),
# so parameter overrides here take precedence.
parameters:
    # Override SAML key paths to point to devconf fixtures (not /config/...)
    saml_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_sp.crt'
    saml_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_sp.key'
    saml_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_idp.crt'
    saml_idp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_idp.key'
    saml_metadata_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_idp.crt'
    saml_metadata_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_idp.key'

    # GSSP key paths (all GSSPs use the same gateway_gssp_sp / gateway_gssp_idp keys in devconf)
    gssp_tiqr_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_tiqr_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_tiqr_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.crt'
    gssp_tiqr_idp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.key'
    gssp_tiqr_metadata_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_tiqr_metadata_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_azuremfa_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_azuremfa_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_azuremfa_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.crt'
