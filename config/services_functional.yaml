    gssp_azuremfa_metadata_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_webauthn_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_webauthn_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_webauthn_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.crt'
    gssp_webauthn_idp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.key'
    gssp_webauthn_metadata_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_webauthn_metadata_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_demo_gssp_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_demo_gssp_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_demo_gssp_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.crt'
    gssp_demo_gssp_idp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.key'
    gssp_demo_gssp_metadata_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
