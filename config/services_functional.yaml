services:
  # Make functional test support classes available
  Surfnet\StepupGateway\Tests\Functional\Support\Database\FixtureBuilder:
    public: true
    arguments:
      - '@service_container'

  Surfnet\StepupGateway\Tests\Functional\Support\Database\DevconfFixtureLoader:
    public: true
    arguments:
      - '@service_container'
      - '%kernel.project_dir%/tests/Functional/Fixtures'

  Surfnet\StepupGateway\Tests\Functional\Support\Saml\SamlFixtureLoader:
    public: true
    arguments:
      - '%kernel.project_dir%/tests/Functional/Fixtures'
