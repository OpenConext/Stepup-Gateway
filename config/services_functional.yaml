# Service and parameter overrides for the "functional" environment used by the PHPUnit functional tests
# Loaded AFTER config/services.yaml (which imports parameters.yaml) so parameter overrides here take precedence.

parameters:
    # Override SAML key paths to point to devconf fixtures (not /config/...)
    saml_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_sp.crt'
    saml_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_sp.key'
    saml_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_idp.crt'
    saml_idp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_idp.key'
    saml_metadata_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_idp.crt'
    saml_metadata_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_idp.key'

    # GSSP key paths (all GSSPs use the same gateway_gssp_sp / gateway_gssp_idp keys in devconf)
    gssp_tiqr_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_tiqr_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_tiqr_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.crt'
    gssp_tiqr_idp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.key'
    gssp_tiqr_metadata_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_tiqr_metadata_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_azuremfa_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_azuremfa_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_azuremfa_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.crt'
    gssp_azuremfa_idp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.key'
    gssp_azuremfa_metadata_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_azuremfa_metadata_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_webauthn_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_webauthn_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_webauthn_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.crt'
    gssp_webauthn_idp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.key'
    gssp_webauthn_metadata_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_webauthn_metadata_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_demo_gssp_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_demo_gssp_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_demo_gssp_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.crt'
    gssp_demo_gssp_idp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.key'
    gssp_demo_gssp_metadata_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_demo_gssp_metadata_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_demo_gssp_2_sp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_demo_gssp_2_sp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'
    gssp_demo_gssp_2_idp_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.crt'
    gssp_demo_gssp_2_idp_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_idp.key'
    gssp_demo_gssp_2_metadata_publickey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.crt'
    gssp_demo_gssp_2_metadata_privatekey: '%kernel.project_dir%/tests/Functional/Fixtures/devconf/keys/gateway_gssp_sp.key'

services:
  # Accepts any well-formed Yubikey OTP without calling Yubico, but keeps the public ID check of the Gateway (unlike the
  # test double in services_test.yaml, that accepts the OTP of any Yubikey)
  surfnet_gateway_api.service.yubikey:
    class: Surfnet\StepupGateway\Tests\Functional\Support\TestDouble\YubikeyService
    public: true
    arguments:
      - "@logger"

  # Keeps the SMS messages instead of sending them, so a test can read the OTP (the test double in services_test.yaml
  # writes it to a cookie with setcookie(), which the test client does not see)
  gateway.service.gateway_api_sms:
    class: Surfnet\StepupGateway\Tests\Functional\Support\TestDouble\SmsService
    public: true
