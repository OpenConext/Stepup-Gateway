---
version: 2
updates:
  # Docker — only patch updates, no bundling
  - package-ecosystem: "docker"
    directories:
      - "/docker/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # GitHub Actions — all updates (patch, minor, major), bundled
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  # npm — only patch updates, no bundling
  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Composer — only patch updates, no bundling
  - package-ecosystem: "composer"
    directories:
      - "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "symfony/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
